services:
  # Backend Web Service
  - type: web
    name: chat-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: |
      python -m pip install -U pip
      pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 run:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: chat-db
          property: connectionString
      # Placeholder for frontend URL (update after first frontend deploy)
      - key: CORS_ORIGINS
        value: https://your-frontend-url.onrender.com

  # Frontend Static Site
  - type: static
    name: chat-frontend
    region: oregon
    rootDir: frontend
    buildCommand: npm install && CI=false npm run build
    publishPath: build
    # Handle React Router client-side routing
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Placeholder for backend URL (update after first backend deploy)
      - key: REACT_APP_API_URL
        value: https://your-backend-url.onrender.com
      - key: REACT_APP_SOCKET_URL
        value: https://your-backend-url.onrender.com

# PostgreSQL Database
databases:
  - name: chat-db
    region: oregon
    plan: free
    databaseName: chatapp
    user: chatuser
